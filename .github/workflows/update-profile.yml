name: Update profile activity
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Fetch and render activity
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: |
          python scripts/fetch_contributions.py --username "$PROFILE_USERNAME"
          python scripts/generate_contribution.py
      - name: Commit changed activity only
        run: |
          git add data/contributions.json assets/contribution.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update profile activity'
          git push
