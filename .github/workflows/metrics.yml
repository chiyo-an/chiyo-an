name: Metrics
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Generate GitHub metrics (Languages only)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: chiyo-an
          template: classic
          base: ''
          config_timezone: Asia/Seoul
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_colors: '0:#a9d8f5, 1:#93c8e9, 2:#7db4db, 3:#689fcb, 4:#568bb8, 5:#4577a4, 6:#37648d, 7:#2c5275'
          output_action: none
          filename: metrics.svg
      - name: Render profile language assets
        run: |
          python scripts/generate_languages.py --source /metrics_renders/metrics.svg
          cp /metrics_renders/metrics.svg metrics.svg
      - name: Commit changed metrics only
        run: |
          git add metrics.svg assets/languages.svg assets/languages-mobile.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update profile languages'
          git push
